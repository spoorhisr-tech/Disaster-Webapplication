name: Laravel CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Set default working directory to 'app' where composer.json and wasmer.toml live
defaults:
  run:
    working-directory: app

jobs:
  # ============================================================================
  # JOB 1: CONTINUOUS INTEGRATION (CI)
  # Runs automated unit and feature tests
  # ============================================================================
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite, bcmath, curl
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('app/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Pint code style check is set to non-blocking so cosmetic issues do not break deployments
      - name: Run Pint Code Style Check (Optional)
        run: vendor/bin/pint --test
        continue-on-error: true

      - name: Execute Tests via PHPUnit
        run: php artisan test --without-tty

  # ============================================================================
  # JOB 2: CONTINUOUS DEPLOYMENT (CD)
  # Automatically deploys to Wasmer Edge only when tests pass on 'main'
  # ============================================================================
  deploy:
    name: Deploy to Wasmer Edge
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Deployment Secrets
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: |
          if [ -z "$WASMER_TOKEN" ]; then
            echo "::error::WASMER_TOKEN secret is missing! Please add it in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "WASMER_TOKEN is verified."

      - name: Install Wasmer CLI
        run: |
          curl https://get.wasmer.io -sSfL | sh
          echo "$HOME/.wasmer/bin" >> $GITHUB_PATH

      - name: Authenticate with Wasmer
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: wasmer login "$WASMER_TOKEN"

      - name: Auto-bump Package Version
        run: |
          NEW_VERSION="0.1.$(( ${{ github.run_number }} + 10 ))"
          sed -i "s/^version = .*/version = \"$NEW_VERSION\"/" wasmer.toml
          echo "Bumping wasmer.toml package version to: $NEW_VERSION"

      - name: Deploy to Wasmer Edge
        run: wasmer deploy --non-interactive --no-wait
