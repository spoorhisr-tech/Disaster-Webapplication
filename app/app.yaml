kind: wasmer.io/App.v0
name: WebApp
owner: spoorhisr-tech
app_id: da_KAmI3tXUmJPa
package: .

capabilities:
  database:
    engine: mysql

env:
  APP_NAME: "DisasterRelief"
  APP_ENV: "production"
  APP_DEBUG: "true"
  APP_KEY: "base64:mSAV+hR8FXG+hYkCfGcT5VIM6ARjHYdzmomJvg0XPtA="
  DB_CONNECTION: "mysql"
  LOG_CHANNEL: "stderr"
  SESSION_DRIVER: "cookie"
  CACHE_STORE: "array"

jobs:
  - name: run-migrations-and-seeds
    trigger: pre-deployment
    action:
      execute:
        command: php
        cli_args:
          - "artisan"
          - "migrate"
          - "--force"
          - "--seed"
