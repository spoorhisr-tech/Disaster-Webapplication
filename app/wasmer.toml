[package]
name = "spoorhisr-tech/webapp"
version = "0.1.8"
description = "Disaster Relief and Emergency Management System"
license = "MIT"

[dependencies]
"shira/php" = "^8.5.10"

[fs]
"/app" = "."

[[command]]
name = "run"
module = "shira/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "0.0.0.0:8080"]
env = ["PHPRC=/app/config/"]
