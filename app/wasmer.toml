[package]
name = "spoorhisr-tech/disaster-relief-fullstack"
version = "0.1.0"
description = "Disaster Relief and Emergency Management System Fullstack App"
license = "MIT"

[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "0.0.0.0:8080"]

